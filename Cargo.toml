[package]
name = "xcx-compiler"
version = "4.1.0"
edition = "2024"

[features]
default = ["jit"]
jit = []

[dependencies]
chrono = "0.4.44"
rand = "0.9.0"
serde_json = "1.0"
ureq = "2.12.1"
tiny_http = "0.12.0"
bcrypt = "0.17"
argon2 = "0.5"
hex = "0.4.3"
ctrlc = "3.4"
parking_lot = "0.12"
mimalloc = { version = "0.1", default-features = false }
rusqlite = { version = "0.32.1", features = ["bundled"] }
flate2 = "1.0"
zip = "2.2"
walkdir = "2.5"
crossterm = "0.28"
base64 = "0.22"
glob = "0.3"
cranelift-codegen = "0.130.0"
cranelift-frontend = "0.130.0"
cranelift-native = "0.130.0"
cranelift-module = "0.130.0"
cranelift-jit = "0.130.0"
cranelift = "0.130.0"
target-lexicon = "0.13.5"
indexmap = "2.14.0"
[profile.release]
debug = false
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = false

[dev-dependencies]
serial_test = "3.1"
