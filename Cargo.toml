[package]
name = "xcx"
version = "4.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[features]
default = ["jit"]
jit = []

[dependencies]
chrono = "0.4.44"
rand = "0.9.0"
serde_json = { version = "1.0", features = ["unbounded_depth"] }
serde = "1.0"
ureq = "2.12.1"
tiny_http = "0.12.0"
bcrypt = "0.17"
argon2 = "0.5"
ctrlc = "3.4"
parking_lot = "0.12"
mimalloc = { version = "0.1", default-features = false }
rusqlite = { version = "0.32.1", features = ["bundled"] }
zip = "2.2"
walkdir = "2.5"
crossterm = "0.28"
base64 = "0.22"
glob = "0.3"
cranelift-codegen = "0.130.0"
cranelift-frontend = "0.130.0"
cranelift-native = "0.130.0"
cranelift-module = "0.130.0"
cranelift-jit = "0.130.0"
cranelift = "0.130.0"
[profile.release]
debug = false
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = false

[profile.dev-release]
inherits = "release"
codegen-units = 16
lto = "thin"

[dev-dependencies]
serial_test = "3.1"
