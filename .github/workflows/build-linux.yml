name: Build & Test Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve XCX version
        run: echo "XCX_VERSION=$(tr -d '[:space:]' < lib/VERSION)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Install mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Run tests (release, builds + tests in one go)
        run: cargo test --release --verbose

      - name: Build distribution package (tar.gz)
        run: |
          chmod +x ./Linux/build_linux_pkg.sh
          ./Linux/build_linux_pkg.sh

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcx-installer-linux
          path: Linux/dist/xcx-installer-linux-v${{ env.XCX_VERSION }}.tar.gz