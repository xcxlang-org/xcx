name: Build & Test FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD Build and Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Test on FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y rust
          run: |
            cargo test --release --verbose
            chmod +x ./FreeBSD/build_freebsd_pkg.sh
            ./FreeBSD/build_freebsd_pkg.sh

      - name: Resolve XCX version
        run: echo "XCX_VERSION=$(tr -d '[:space:]' < lib/VERSION)" >> "$GITHUB_ENV"

      - name: Upload FreeBSD package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcx-installer-freebsd
          path: FreeBSD/dist/xcx-installer-freebsd-v${{ env.XCX_VERSION }}.tar.gz
