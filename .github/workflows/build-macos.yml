name: Build & Test macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Run tests (release, builds + tests in one go)
        run: cargo test --release --verbose

      - name: Build distribution package (tar.gz)
        run: |
          chmod +x ./build-macos-package.sh   # adjust path to match the script's location in your repo
          ./build-macos-package.sh

      - name: Upload macOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcx-installer-macos
          path: dist/xcx-installer-macos-v4.1.tar.gz   # adjust path to match SCRIPT_DIR in build-macos-package.sh